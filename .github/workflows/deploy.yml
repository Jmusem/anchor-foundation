# Builds the site and uploads it to the Pinnacle (cPanel) account on every push to main.
# Uses cPanel's HTTPS API (port 2083) because the host blocks outside FTP (port 21).
# Setup: see DEPLOY.md (repository secrets CPANEL_USER, CPANEL_HOST, CPANEL_TOKEN).
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      WEB_DIR: ${{ vars.WEB_DIR || '/public_html' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://anchorfoundation.co.ke' }}
          VITE_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}

      - name: Upload to cPanel
        run: |
          [ -n "$CPANEL_TOKEN" ] || { echo "::error::Secret CPANEL_TOKEN is missing (see DEPLOY.md)"; exit 1; }
          API="https://$CPANEL_HOST:2083"
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN"
          cd dist
          fail=0
          # one request per folder: create it if needed, then upload every file in it (overwriting)
          while IFS= read -r d; do
            rel="${d#./}"; [ "$d" = "." ] && rel=""
            target="$WEB_DIR${rel:+/$rel}"
            if [ -n "$rel" ]; then
              curl -sS -m 60 -H "$AUTH" -G "$API/json-api/cpanel"                 --data-urlencode "cpanel_jsonapi_user=$CPANEL_USER" --data-urlencode "cpanel_jsonapi_apiversion=2"                 --data-urlencode "cpanel_jsonapi_module=Fileman" --data-urlencode "cpanel_jsonapi_func=mkdir"                 --data-urlencode "path=$(dirname "$target")" --data-urlencode "name=$(basename "$target")" >/dev/null || true
            fi
            args=(); n=0
            while IFS= read -r -d '' file; do n=$((n+1)); args+=(-F "file-$n=@$file;filename=$(basename "$file")"); done               < <(find "$d" -maxdepth 1 -type f -print0)
            [ $n -eq 0 ] && continue
            echo "Uploading $n file(s) to $target"
            R=$(curl -sS -m 600 -H "$AUTH" -F "dir=$target" -F "overwrite=1" "${args[@]}" "$API/execute/Fileman/upload_files")
            echo "$R" | head -c 600; echo
            echo "$R" | grep -q '"status":1' || { echo "::error::Upload failed for $target"; fail=1; }
          done < <(find . -type d)
          exit $fail

      - name: Check site is live
        run: |
          sleep 3
          curl -fsSL "${{ vars.SITE_URL || 'https://anchorfoundation.co.ke' }}/" | grep -q "Anchor Foundation" && echo "Site is serving the new build"
